<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小釜 · 自助小火锅 — 座位分配</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <!-- ═══════ 顶栏：品牌 + 实时统计条 ═══════ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10h17v3.5a8.5 8.5 0 0 1-17 0z"/><path d="M8 6.2c.8.6 1.5 1.5 1.5 2.6"/><path d="M14.5 6.2c.8.6 1.5 1.5 1.5 2.6"/></svg>
      </span>
      <div>
        <div class="brand-name">小釜</div>
        <div class="brand-sub">自助小火锅 · 座位分配</div>
      </div>
    </div>
    <div id="stats" class="stats" aria-label="实时统计"></div>
    <div class="open-chip">营业中</div>
  </header>

  <!-- ═══════ 工作区：座位图 + 排队面板 ═══════ -->
  <main class="workspace">
    <section class="map-col">

      <!-- 选位横幅 -->
      <div id="selBar" class="banner banner-sel hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8" r="3.5"/><path d="M3.5 19c.7-3 3.2-5 6-5s5.3 2 6 5"/><path d="M19 7v6M16 10h6"/></svg>
        <span class="banner-txt" id="selTxt"></span>
        <button type="button" class="btn btn-ghost" id="btnSelCancel">取消选位</button>
      </div>

      <!-- 拆坐合并提示条 -->
      <div id="mergeBar" class="banner banner-merge hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="banner-txt" id="mergeTxt"></span>
        <button type="button" class="btn btn-secondary btn-sm" id="btnMergeOpen">查看合并</button>
        <button type="button" class="btn btn-ghost" id="btnMergeLater">稍后处理</button>
      </div>

      <!-- 座位图 -->
      <div id="seatmap" class="seatmap"></div>

      <!-- 选位方案条（底部浮出） -->
      <div id="candBar" class="cand-bar hidden">
        <span class="cand-title">选择方案</span>
        <div id="candChips" class="cand-chips"></div>
      </div>
    </section>

    <!-- 排队面板 -->
    <aside id="queuePanel" class="queue">
      <div class="queue-head">
        <span class="qtitle">排队 <span id="qcnt" class="qcnt num">0 桌</span></span>
      </div>
      <div id="qlist" class="qlist"></div>
    </aside>
  </main>

  <!-- ═══════ 底部工具栏 ═══════ -->
  <footer class="toolbar">
    <div class="toolbar-left">
      <button type="button" class="btn btn-primary btn-lg" id="btnSeat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="8" r="3.5"/><path d="M3.5 19c.7-3 3.2-5 6-5s5.3 2 6 5"/><path d="M19 7v6M16 10h6"/></svg>
        来客入座
      </button>
      <button type="button" class="btn btn-secondary btn-lg" id="btnQueue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        加入排队
      </button>
    </div>
    <div class="toolbar-right">
      <button type="button" class="btn btn-ghost" id="btnLayout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        布局设置
      </button>
      <button type="button" class="btn btn-ghost" id="btnStats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 20v-6M11 20V6M17 20v-9"/><path d="M3 20h18"/></svg>
        统计
      </button>
      <button type="button" class="btn btn-danger" id="btnReset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        重置今日
      </button>
    </div>
  </footer>
</div>

<!-- ═══════ 弹窗：来客入座 ═══════ -->
<div class="modal" id="mSeat" role="dialog" aria-modal="true" aria-labelledby="mSeatTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title" id="mSeatTitle">来客入座</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="step-row">
        <span class="step-label">人数</span>
        <div class="stepper">
          <button type="button" class="step-btn" id="seatDec" aria-label="减少人数"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <span class="step-val" id="seatK">2</span>
          <button type="button" class="step-btn" id="seatInc" aria-label="增加人数"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div class="quick" id="quickBtns" role="group" aria-label="快捷人数"></div>
      <div class="field">
        <label for="seatNote">备注（选填）</label>
        <input id="seatNote" class="input" type="text" placeholder="例如：两位老人、靠窗、不拼桌">
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="btnSeatGo">查看可选位置 →</button>
    </div>
  </div>
</div>

<!-- ═══════ 弹窗：确认入座 ═══════ -->
<div class="modal" id="mConfirm" role="dialog" aria-modal="true" aria-labelledby="mConfirmTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title" id="mConfirmTitle">确认入座</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body">
      <p id="cfInfo" class="cf-info"></p>
      <div id="cfSeats" class="seat-chips"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="btnCfGo">确认入座</button>
    </div>
  </div>
</div>

<!-- ═══════ 弹窗：无空位 ═══════ -->
<div class="modal" id="mNoFit" role="dialog" aria-modal="true" aria-labelledby="mNoFitTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title" id="mNoFitTitle">没有连坐空位</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body">
      <p id="nofitMsg" class="cf-info"></p>
      <div id="splitPlanBox" class="plan-area hidden"></div>
      <div id="shiftPlanBox" class="plan-area hidden"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="btnNfQueue">加入排队</button>
    </div>
  </div>
</div>

<!-- ═══════ 弹窗：拆坐合并确认 ═══════ -->
<div class="modal" id="mMerge" role="dialog" aria-modal="true" aria-labelledby="mMergeTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title" id="mMergeTitle">合并确认</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body">
      <p id="mgInfo" class="cf-info"></p>
      <div id="mgSeats" class="seat-chips"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-danger" id="btnMgNo">客人拒绝（不再提议）</button>
      <button type="button" class="btn btn-secondary" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="btnMgGo">确认合并</button>
    </div>
  </div>
</div>

<!-- ═══════ 弹窗：移位拼座确认 ═══════ -->
<div class="modal" id="mShift" role="dialog" aria-modal="true" aria-labelledby="mShiftTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title" id="mShiftTitle">移位拼座确认</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body">
      <div id="shInfo" class="shift-list"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close>取消</button>
      <button type="button" class="btn btn-primary" id="btnShGo">全部同意，执行</button>
    </div>
  </div>
</div>

<!-- ═══════ 弹窗：座位操作 ═══════ -->
<div class="modal" id="mSeatOp" role="dialog" aria-modal="true" aria-labelledby="mSeatOpTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title" id="mSeatOpTitle">座位操作</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body">
      <div id="soInfo" class="so-info"></div>
      <div id="soActions" class="btn-row"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-secondary" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- ═══════ 弹窗：布局设置 ═══════ -->
<div class="modal" id="mLayout" role="dialog" aria-modal="true" aria-labelledby="mLayoutTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-card wide">
    <div class="modal-head">
      <h2 class="modal-title" id="mLayoutTitle">布局设置</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="switch-row">
        <label class="switch"><input type="checkbox" id="chkSplit" checked><span class="track"></span>允许拆坐入座</label>
        <label class="switch"><input type="checkbox" id="chkShift" checked><span class="track"></span>允许移位拼座</label>
      </div>
      <div id="layoutRows" class="layout-rows"></div>
      <div class="add-row">
        <input id="addName" class="input" type="text" placeholder="排名称，如 E区/靠窗">
        <input id="addCount" class="input small" type="number" min="1" max="40" placeholder="座数">
        <button type="button" class="btn btn-secondary" id="btnAddRow">添加一排</button>
      </div>
      <p class="demo-note">保存后现有占用按座位号保留；被删的排上如有客人会被释放并提示。建议营业前先设好布局。</p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="btnDemo">恢复演示布局</button>
      <button type="button" class="btn btn-primary" id="btnLayoutSave">保存布局</button>
    </div>
  </div>
</div>

<!-- ═══════ 弹窗：营业统计 ═══════ -->
<div class="modal" id="mStats" role="dialog" aria-modal="true" aria-labelledby="mStatsTitle">
  <div class="modal-overlay" data-close></div>
  <div class="modal-card wide">
    <div class="modal-head">
      <h2 class="modal-title" id="mStatsTitle">营业统计</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="modal-body">
      <div id="statsBody" class="mcard-grid"></div>
      <div class="btn-row"><button type="button" class="btn btn-secondary" id="btnSim">▶ 仿真对比今日客流（4 套配置）</button></div>
      <div id="simResult" class="sim hidden"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-primary" data-close>关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
